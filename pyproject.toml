[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytesprite"
dynamic = ["version"]
description = "Frosted paperclip desktop companion for Windows with Pear Music lyrics and dev tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Boci0/bytesprite"
Issues = "https://github.com/Boci0/bytesprite/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bytesprite = "src.main:main"

[project.gui-scripts]
bytesprite-gui = "src.main:main"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
