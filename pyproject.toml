[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperduck"
dynamic = ["version"]
description = "Frosted paperclip desktop companion for Windows with dev tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyQt6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Boci0/paperduck"
Issues = "https://github.com/Boci0/paperduck/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
paperduck = "src.main:main"

[project.gui-scripts]
paperduck-gui = "src.main:main"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
